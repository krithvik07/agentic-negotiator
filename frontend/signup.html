<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signup - Negotiation Demo</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header>
    <a class="tag" href="/frontend/index.html">Home</a>
    <a class="tag" href="/frontend/signup.html">Signup</a>
    <a class="tag" href="/frontend/login.html">Login</a>
    <a class="tag" href="/frontend/request.html">Request</a>
    <a class="tag" href="/frontend/negotiate.html">Negotiate</a>
    <a class="tag" href="/frontend/summary.html">Summary</a>
  </header>
  <main>
    <section>
      <h2>Signup (Consumer)</h2>
      <label>Name</label>
      <input id="name" value="Alice Consumer" />
      <label>Email</label>
      <input id="email" value="alice@example.com" />
      <label>Password</label>
      <input id="password" type="password" value="test123" />
      <button id="btnSignup">Signup</button>
      <pre id="signup_out"></pre>
    </section>

    <section>
      <h2>Already registered?</h2>
      <p>If you already have an account, go to the login page.</p>
      <button id="btnGoLogin">Go to Login</button>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
