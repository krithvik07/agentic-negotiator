<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register Product - Negotiation Demo</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header>
    <a class="tag" href="/frontend/index.html">Home</a>
    <a class="tag" href="/frontend/signup.html">Signup</a>
    <a class="tag" href="/frontend/login.html">Login</a>
    <a class="tag" href="/frontend/role.html">Select Role</a>
    <a class="tag" href="/frontend/producer.html">Register Product</a>
  </header>
  <main>
    <section>
      <h2>Register Product (Producer)</h2>
      <label>Producer ID</label>
      <input id="producer_id" placeholder="From login/signup" />

      <label>Product Name</label>
      <input id="prod_name" value="Cement" />

      <div class="row">
        <div>
          <label>Price</label>
          <input id="prod_price" type="number" step="0.01" value="70" />
        </div>
        <div>
          <label>Quantity</label>
          <input id="prod_qty" type="number" value="500" />
        </div>
      </div>

      <label>Specs (JSON)</label>
      <textarea id="prod_specs" rows="3">{
  "quality": "A",
  "origin": "Gujarat"
}</textarea>

      <label>Domain</label>
      <select id="prod_domain">
        <option>construction</option>
        <option>agriculture</option>
        <option>handicrafts</option>
        <option>pharmaceuticals</option>
        <option>textiles</option>
      </select>

      <button id="btnAddProduct">Register Product</button>
      <pre id="producer_out"></pre>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
